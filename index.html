<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vidas Restauradas Tabio - Control de Asistencia</title>
  
  <meta name="theme-color" content="#132B59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vr: {
              blue: '#132B59',
              orange: '#FF5722',
              green: '#236B2B',
              red: '#A92222',
              beige: '#FBF9F5',
              sand: '#EFECE4'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FBF9F5;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tap-effect:active {
      transform: scale(0.97);
      transition: transform 0.08s;
    }
  </style>
</head>
<body class="bg-vr-beige text-gray-900 antialiased min-h-screen flex flex-col pb-24">

  <!-- TOP HEADER WITH OFFICIAL BRANDING -->
  <header class="bg-vr-blue text-white sticky top-0 z-30 shadow-lg border-b-2 border-vr-orange">
    <div class="max-w-3xl mx-auto px-4 pt-3 pb-2.5">
      <!-- Institutional Branding Header with Real Official Logo -->
      <div class="flex items-center justify-between">
        <div class="flex-1 pr-2">
          <img src="logo_blanco.png" alt="Vidas Restauradas - Iglesia Cristiana Sede Tabio - Asambleas de Dios" class="h-12 sm:h-16 object-contain filter drop-shadow">
        </div>
        <div class="text-right flex-shrink-0">
          <span class="inline-block px-2.5 py-0.5 rounded-full text-[9px] font-black bg-vr-orange text-white uppercase tracking-wider shadow">
            Mateo 28:19-20
          </span>
          <p class="text-[10px] text-teal-200 mt-0.5 font-bold tracking-tight">Ministerio de Servicio</p>
        </div>
      </div>

      <!-- SUNDAY SELECTOR -->
      <div class="mt-2.5 bg-white/10 backdrop-blur-sm rounded-xl p-2 flex items-center justify-between text-xs sm:text-sm font-semibold">
        <div class="flex items-center space-x-2 flex-1">
          <svg class="w-4 h-4 text-vr-orange flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <select id="selectSunday" onchange="changeSunday(this.value)" class="bg-transparent text-white font-semibold text-xs sm:text-sm w-full focus:outline-none cursor-pointer py-0.5">
            <!-- Populated dynamically via JS -->
          </select>
        </div>
      </div>
    </div>

    <!-- LIVE COUNTERS FOR ATTENDANCE -->
    <div class="bg-black/25 border-t border-white/10 px-4 py-1.5">
      <div class="max-w-3xl mx-auto grid grid-cols-3 gap-2 text-center">
        <div class="bg-vr-green/40 rounded-lg py-1 px-1.5 border border-vr-green/50">
          <p class="text-xs text-green-200 uppercase font-bold">Presentes</p>
          <p id="counterPresent" class="text-xl sm:text-2xl font-black text-white">0</p>
        </div>
        <div class="bg-white/10 rounded-lg py-1 px-1.5 border border-white/10">
          <p class="text-xs text-gray-300 uppercase font-bold">Padrón</p>
          <p id="counterTotal" class="text-xl sm:text-2xl font-black text-white">0</p>
        </div>
        <div class="bg-vr-orange/40 rounded-lg py-1 px-1.5 border border-vr-orange/50">
          <p class="text-xs text-orange-200 uppercase font-bold">% Asistencia</p>
          <p id="counterPercentage" class="text-xl sm:text-2xl font-black text-white">0.0%</p>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- MAIN ATTENDANCE VIEW                      -->
  <!-- ========================================== -->
  <main class="max-w-3xl mx-auto w-full px-4 pt-3 flex-1">

    <!-- SEARCH BAR (PREDICTIVE / TYPEAHEAD) -->
    <div class="relative mb-2">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input 
        type="text" 
        id="searchInput" 
        oninput="handleSearch(this.value)"
        placeholder="Escribe una inicial o nombre..." 
        autocomplete="off"
        class="w-full pl-9 pr-9 py-3.5 bg-white border-2 border-gray-300 rounded-2xl shadow-sm text-base sm:text-lg text-gray-800 font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-vr-blue"
      >
      <button 
        id="btnClearSearch" 
        onclick="clearSearch()" 
        class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
      >
        ✕
      </button>
    </div>

    <!-- ALPHABET COMPLETE GRID (TODAS LAS LETRAS A-Z + Ñ) -->
    <div class="mb-3.5 bg-white p-2.5 rounded-2xl border border-gray-200 shadow-sm">
      <div class="flex items-center justify-between mb-1.5 px-1">
        <span class="text-xs font-black uppercase text-gray-500 tracking-wider">Índice Alfabético (A - Z):</span>
        <span class="text-[11px] text-gray-400">Toca una letra para filtrar</span>
      </div>
      <div class="flex flex-wrap gap-1 sm:gap-1.5 items-center justify-start">
        <button onclick="filterByLetter('TODOS')" class="letter-btn active-letter px-3 py-1.5 text-xs font-black rounded-xl bg-vr-blue text-white tap-effect shadow-sm">
          TODOS
        </button>
        <div id="alphabetContainer" class="flex flex-wrap gap-1 sm:gap-1.5"></div>
      </div>
    </div>

    <!-- STATUS FILTERS -->
    <div class="flex items-center justify-between mb-2.5 text-xs sm:text-sm font-semibold">
      <div class="flex space-x-1">
        <button onclick="setStatusFilter('all')" id="btnFilterAll" class="px-3.5 py-1.5 rounded-full font-bold text-xs sm:text-sm bg-vr-blue text-white tap-effect">
          Todos (<span id="countFilterAll">0</span>)
        </button>
        <button onclick="setStatusFilter('present')" id="btnFilterPresent" class="px-3.5 py-1.5 rounded-full font-semibold text-xs sm:text-sm bg-white text-vr-green border border-gray-300 tap-effect">
          Presentes (<span id="countFilterPresent">0</span>)
        </button>
        <button onclick="setStatusFilter('absent')" id="btnFilterAbsent" class="px-3.5 py-1.5 rounded-full font-semibold text-xs sm:text-sm bg-white text-gray-500 border border-gray-300 tap-effect">
          Ausentes (<span id="countFilterAbsent">0</span>)
        </button>
      </div>
      <span id="filteredResultsLabel" class="text-gray-500 font-medium"></span>
    </div>

    <!-- MEMBERS LIST -->
    <div id="membersList" class="space-y-2">
      <!-- Injected dynamically -->
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="hidden text-center py-10 px-4">
      <p class="text-sm font-semibold text-gray-600">No se encontraron asistentes con ese filtro.</p>
    </div>
  </main>

  <!-- FLOATING BOTTOM BAR -->
  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-gray-200 z-20 py-2.5 px-4 shadow-xl">
    <div class="max-w-3xl mx-auto flex items-center justify-between space-x-2">
      <!-- Sync button -->
      <button onclick="syncToExcelBackend()" id="btnSyncExcel" class="flex-1 bg-vr-blue hover:bg-blue-900 active:bg-blue-950 text-white font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 text-xs sm:text-sm shadow-md tap-effect">
        <svg class="w-4 h-4 text-vr-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
        </svg>
        <span>Guardar en Excel</span>
      </button>

      <!-- Export / Download button -->
      <button onclick="exportToExcel()" class="py-3.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-2xl flex items-center justify-center space-x-1.5 text-xs sm:text-sm shadow-sm tap-effect border border-gray-300">
        <svg class="w-4 h-4 text-vr-green" fill="currentColor" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
        </svg>
        <span>Descargar</span>
      </button>

      <!-- + New Attendee Button -->
      <button onclick="openNewMemberModal()" class="py-3.5 px-5 bg-vr-orange hover:bg-orange-600 text-white font-black rounded-2xl flex items-center justify-center space-x-1.5 text-xs sm:text-sm shadow-md tap-effect">
        <span>+ Nuevo</span>
      </button>
    </div>
  </div>

  <!-- MODAL: REGISTRAR NUEVO ASISTENTE -->
  <div id="newMemberModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-orange-100 text-vr-orange flex items-center justify-center font-bold">
            +
          </div>
          <h2 class="text-base font-bold text-gray-900">Registrar Nuevo Asistente</h2>
        </div>
        <button onclick="closeNewMemberModal()" class="p-1 rounded-full text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <form id="formNewMember" onsubmit="saveNewMember(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombres y Apellidos *</label>
          <input type="text" id="newNombre" required placeholder="Ej. Juan Carlos Pérez" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-vr-blue focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Teléfono / WhatsApp</label>
          <input type="tel" id="newTelefono" placeholder="Ej. 312 345 6789" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-vr-blue focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Fecha Nacimiento</label>
            <input type="date" id="newFechaNac" class="w-full px-2.5 py-2 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-vr-blue focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Grupo Etario</label>
            <select id="newGrupo" class="w-full px-2.5 py-2 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-vr-blue focus:outline-none bg-white">
              <option value="Mayores (26 a 55)">Mayores (26 a 55)</option>
              <option value="Jóvenes (14 a 25)">Jóvenes (14 a 25)</option>
              <option value="Niños (0 a 13)">Niños (0 a 13)</option>
              <option value="Adultos Mayores (56+)">Adultos Mayores (56+)</option>
            </select>
          </div>
        </div>
        <div class="pt-2 flex space-x-2">
          <button type="button" onclick="closeNewMemberModal()" class="flex-1 py-2.5 border border-gray-300 rounded-xl font-bold text-xs text-gray-600 tap-effect">Cancelar</button>
          <button type="submit" class="flex-1 py-2.5 bg-vr-orange hover:bg-orange-600 text-white rounded-xl font-black text-xs shadow-md tap-effect">✓ Guardar y Asistir</button>
        </div>
      </form>
    </div>
  </div>

  <script src="members.js"></script>
  <script src="app.js"></script>
</body>
</html>
